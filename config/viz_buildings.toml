# Wysokości budynków w widoku 3D okna odtwarzacza (D26, krok 6, pipeline/viz_buildings.py).
# Wszystko poniżej to ZAŁOŻENIA wizualne, wartości robocze do potwierdzenia przez właściciela. Nie są pomiarem.
# Kolejność: tag `height` (dokładnie) > `building:levels` × floor_height_m > H0 klasy `building=*`.
# Do wysokości wyprowadzonej (piętra, klasa) dochodzi ±spread z hasha id budynku (deterministycznie).

variant = "per_class"   # "per_class": H0 wg klasy poniżej; "single": jedna stała single_m dla wszystkich
floor_height_m = 3.0    # OSM wiki OSM-3D: 3 m na kondygnację
spread = 0.15           # ±15%
single_m = 7.0          # wariant "single"
default_m = 7.0         # klasa spoza tabeli i `building=yes`

