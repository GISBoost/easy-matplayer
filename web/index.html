<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>easy-matplayer — GISBoost</title>
<meta name="description" content="Odtwarzacz wyników symulacji ruchu MATSim w przeglądarce.">
<link rel="icon" href="https://gisboost.github.io/mapy-analizy/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://gisboost.github.io/assets/gisboost-1.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  header { background: var(--chrome); color: var(--chrome-ink); padding: 32px 28px; }
  header .wrap, main.wrap { max-width: 900px; margin: 0 auto; }
  header h1 { font-family: var(--display); font-weight: 800; font-size: 1.9rem; margin: 0 0 10px; }
  header p { margin: 0; color: #b9c4d1; font-size: 0.94rem; line-height: 1.55; }
  main.wrap { padding: 32px 28px 48px; }
  footer.note { max-width: 900px; margin: 0 auto; padding: 20px 28px 40px; font-size: 0.78rem; color: var(--ink-muted); border-top: 1px solid var(--border); }
  footer.note a { color: var(--ink-muted); }
  .meta { margin-top: 8px; color: var(--ink-muted); font-size: 0.78rem; }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand"><a class="mark" href="https://gisboost.github.io/">GISBoost</a> <a class="sub" href="https://gisboost.github.io/mapy-analizy/" id="brandSub">/ analizy mapowe</a></span>
  <nav class="topnav">
    <a class="topnav-link" href="https://gisboost.github.io/mapy-analizy/" id="navCatalog">Analizy</a>
    <a class="topnav-link" href="./" aria-current="page" id="navSim">Symulacja ruchu</a>
    <button class="topnav-link lang" id="langToggleBtn" type="button" aria-label="Przełącz język">EN</button>
  </nav>
</div>

<header>
  <div class="wrap">
    <h1>easy-matplayer</h1>
    <p id="intro"></p>
  </div>
</header>

<main class="wrap">
  <p class="eyebrow" id="eyebrow"></p>
  <div class="cards" id="cards"></div>
</main>

<footer class="note" id="note"></footer>

<script>
// Ten sam klucz języka co w hubie (mapy-analizy): obie strony są na gisboost.github.io, więc wybór jest wspólny.
const LANG_KEY = "mapyAnalizyLang";
const TXT = {
  pl: {brandSub: "/ analizy mapowe", navCatalog: "Analizy", navSim: "Symulacja ruchu", aria: "Przełącz język", btn: "EN",
       intro: "Odtwarzacz wyników symulacji ruchu MATSim w przeglądarce. Wybierz scenariusz i oglądaj auta na mapie, także z budynkami 3D.",
       eyebrow: "Scenariusze", size: "dane", lic: "licencja danych",
       note: "Wymaga przeglądarki na komputerze z WebGL2 (Chrome, Edge, Firefox). Pobierane są tylko oglądane fragmenty doby; podkłady OpenStreetMap i GUGiK idą z ich serwerów, które widzą oglądany obszar. Wersja na Windows z własnymi runami i podkładami WMS: ",
       app: "easy-matplayer na GitHubie"},
  en: {brandSub: "/ map analyses", navCatalog: "Analyses", navSim: "Traffic simulation", aria: "Switch language", btn: "PL",
       intro: "A browser player for MATSim traffic simulation results. Pick a scenario and watch the cars on the map, with 3D buildings.",
       eyebrow: "Scenarios", size: "data", lic: "data licence",
       note: "Needs a desktop browser with WebGL2 (Chrome, Edge, Firefox). Only the parts of the day you watch are downloaded; the OpenStreetMap and GUGiK base maps are fetched from their servers, which see the viewed area. Windows app for your own runs and WMS base maps: ",
       app: "easy-matplayer on GitHub"},
};
let lang = "pl";
try { lang = localStorage.getItem(LANG_KEY) === "en" ? "en" : "pl"; } catch (e) { /* bez zapisu: polski */ }
let list = [];
function render() {
  const t = TXT[lang];
  document.documentElement.lang = lang;
  document.getElementById("brandSub").textContent = t.brandSub;
  document.getElementById("navCatalog").textContent = t.navCatalog;
  document.getElementById("navSim").textContent = t.navSim;
  const btn = document.getElementById("langToggleBtn");
  btn.textContent = t.btn;
  btn.setAttribute("aria-label", t.aria);
  document.getElementById("intro").textContent = t.intro;
  document.getElementById("eyebrow").textContent = t.eyebrow;
  const box = document.getElementById("cards");
  box.replaceChildren();
  list.forEach((s) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = "player/?run=" + encodeURIComponent(s.id);
    const h = document.createElement("h2"); h.textContent = s.title[lang] || s.title.en;
    const p = document.createElement("p"); p.textContent = s.desc[lang] || s.desc.en;
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = t.size + ": " + (s.size_mb ? s.size_mb + " MB · " : "") + t.lic + ": " + s.license;
    a.append(h, p, m);
    box.appendChild(a);
  });
  const note = document.getElementById("note");
  note.replaceChildren(document.createTextNode(t.note));
  const l = document.createElement("a"); l.href = "https://github.com/GISBoost/easy-matplayer"; l.textContent = t.app;
  note.appendChild(l);
}
document.getElementById("langToggleBtn").addEventListener("click", () => {
  lang = lang === "pl" ? "en" : "pl";
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* bez zapisu */ }
  render();
});
render();
fetch("scenarios.json").then((r) => r.json()).then((j) => { list = j; render(); });
</script>
</body>
</html>
