name: easy-matplayer - web (GitHub Pages)

# Ręczny start: bierze zip demo z wydania (easy-matplayer-demo-kutno.zip), buduje stronę (scripts/web_build.py) i publikuje.
# Jednorazowo właściciel włącza w Settings > Pages źródło "GitHub Actions".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag wydania z plikiem easy-matplayer-demo-kutno.zip (np. viz-v0.1.0)'
        required: true

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Download demo run
        run: |
          set -euo pipefail
          mkdir runs
          gh release download "${{ github.event.inputs.tag }}" --pattern 'easy-matplayer-demo-kutno.zip' --dir runs
          unzip -q runs/easy-matplayer-demo-kutno.zip -d runs/unzipped
          mv runs/unzipped/easy-matplayer-demo/demo-kutno runs/demo-kutno

      - name: Build site
        run: |
          set -euo pipefail
          EASY_MATPLAYER_DATA="$RUNNER_TEMP/data" uv run --group viz python scripts/web_build.py runs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
