<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>easy-matviz</title>
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<style>
html, body { margin: 0; height: 100%; background: #121418; color: #e7e9ee;
  font-family: "Segoe UI", sans-serif; font-size: 14px; }
body { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 1fr 52px; overflow: hidden; }
#stage { position: relative; min-width: 0; min-height: 0; grid-column: 1; grid-row: 1; }
#map { position: absolute; inset: 0; background: #121418; }
#nogl { position: absolute; inset: 0; z-index: 600; display: none; align-items: center; justify-content: center;
  padding: 24px; text-align: center; background: #121418; line-height: 1.5; }
[hidden] { display: none !important; }
#legend { position: absolute; z-index: 500; left: 12px; bottom: 22px; display: flex; flex-direction: column; gap: 6px;
  align-items: flex-start; padding: 6px 8px; border-radius: 6px; background: rgba(18, 20, 24, .82);
  color: #e7e9ee; font-size: 12px; }
#lg-speed { display: flex; gap: 8px; align-items: center; }
.lg-list { display: grid; grid-template-columns: 1fr; gap: 3px; }
.lg-list div { display: flex; align-items: center; gap: 6px; }
.lg-list i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; }
#lg-class i { width: 10px; height: 10px; border-radius: 50%; }
#bleg { display: none; max-width: 360px; line-height: 1.3; }
#opts { margin: 0 0 14px; display: flex; flex-direction: column; gap: 8px; }
#opts label { color: #9aa3b2; cursor: pointer; }
#opts .chip { align-self: flex-start; }
#legend .bar { width: 128px; height: 8px; border-radius: 4px;
  background: linear-gradient(90deg, rgb(255, 31, 13) 0%, rgb(255, 179, 26) 40%, rgb(26, 230, 255) 100%); }
#panel { background: #1b1f27; overflow: auto; padding: 16px 16px 12px; min-height: 0;
  grid-column: 2; grid-row: 1; }
#panel h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
#panel .run { margin: 0 0 12px; color: #9aa3b2; font-size: 12px; word-break: break-all; }
#find input { width: 100%; box-sizing: border-box; background: #121418; color: #e7e9ee;
  border: 1px solid #2a3140; border-radius: 6px; padding: 8px; font: inherit; }
#hits { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
#hits button, .chip, #bar button { font: inherit; cursor: pointer; }
#hits button { text-align: left; background: #121418; color: #e7e9ee; border: 1px solid #2a3140;
  border-radius: 6px; padding: 6px 8px; }
#chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
.chip { background: transparent; color: #9aa3b2; border: 1px solid #2a3140; border-radius: 999px; padding: 4px 10px; }
.chip.on { color: #e7e9ee; border-color: #7eb6ff; }
#detail { line-height: 1.45; }
#detail div { margin: 0; }
#axis { margin-top: 14px; }
#axis-bar { position: relative; height: 36px; border-radius: 4px; background: #121418; cursor: pointer; }
#axis-bar .seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center;
  overflow: hidden; background: #3d4656; color: #e7e9ee; font-size: 12px; white-space: nowrap; }
#axis-bar .seg.trip { background: #7eb6ff; color: #121418; }
#axis-bar .seg.on { outline: 1px solid #e7e9ee; z-index: 1; }
#axis-bar .now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #e7e9ee; pointer-events: none; z-index: 2; }
#axis-ends { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; color: #9aa3b2; font-size: 11px; font-variant-numeric: tabular-nums; }
.muted { color: #9aa3b2; }
#credit { margin: 14px 0 0; font-size: 12px; }
#hint { margin-top: 18px; color: #9aa3b2; font-size: 12px; line-height: 1.4; }
#bar { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #1b1f27; min-width: 0;
  grid-column: 1 / -1; grid-row: 2; }
#bar button { background: #121418; color: #e7e9ee; border: 1px solid #2a3140; border-radius: 6px; padding: 4px 10px; }
#bar button.on, #play.on { border-color: #7eb6ff; color: #7eb6ff; }
#slider { flex: 1; min-width: 80px; accent-color: #7eb6ff; }
#mval { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
#clock { font-variant-numeric: tabular-nums; min-width: 72px; }
#count, #sample, #base, #curves { color: #9aa3b2; white-space: nowrap; }
body.panel-off { grid-template-columns: 1fr 0; }
body.panel-off #panel { display: none; }
.maplibregl-map { font-family: "Segoe UI", sans-serif; }
.maplibregl-ctrl-group { background: #1b1f27; box-shadow: none; }
.maplibregl-ctrl-group button + button { border-top-color: #2a3140; }
.maplibregl-ctrl-icon { filter: invert(1) brightness(.85); }
.maplibregl-ctrl-attrib { background: rgba(18, 20, 24, .75) !important; color: #9aa3b2; }
.maplibregl-ctrl-attrib a { color: #7eb6ff; }
</style>
</head>
<body>
<div id="stage">
  <div id="map"></div>
  <div id="nogl"></div>
  <div id="legend">
    <div id="lg-speed"><div class="bar"></div><span>0 / 20 / 50 km/h</span></div>
    <div id="lg-class" class="lg-list" hidden></div>
    <div id="lg-road" class="lg-list" hidden></div>
    <span id="bleg"></span>
  </div>
</div>
<aside id="panel">
  <h1>easy-matviz</h1>
  <p class="run" id="run"></p>
  <button id="openrun" type="button" class="chip">otwórz run…</button>
  <p id="runmsg" class="muted" hidden></p>
  <form id="find"><input id="q" type="text" placeholder="id pojazdu" autocomplete="off" spellcheck="false"></form>
  <div id="hits"></div>
  <div id="chips"></div>
  <div id="opts">
    <label><input type="checkbox" id="osmroads"> kolor dróg OSM</label>
    <label><input type="checkbox" id="models"> modele 3D pojazdów</label>
    <button id="carcolor" type="button" class="chip">kolor auta: prędkość</button>
  </div>
  <div id="detail" class="muted">Kliknij auto albo drogę.</div>
  <div id="axis" hidden>
    <div id="axis-bar"></div>
    <div id="axis-ends"><span id="axis-a"></span><span id="axis-note">postoje ściśnięte</span><span id="axis-b"></span></div>
  </div>
  <p id="credit" class="muted" hidden>Modele aut: Quaternius (CC0).</p>
  <p id="hint">Spacja: start. Strzałki: ±1 min. F: śledź. Esc: wyczyść. Prawy przycisk myszy: obrót i pochylenie mapy.</p>
</aside>
<div id="bar">
  <button id="play" type="button">start</button>
  <button id="mdn" type="button" title="mnożnik −1">◀</button>
  <span id="mval">1×</span>
  <button id="mup" type="button" title="mnożnik +1">▶</button>
  <button type="button" data-m="1" class="on">1×</button>
  <button type="button" data-m="10">10×</button>
  <button type="button" data-m="60">60×</button>
  <button type="button" data-m="300">300×</button>
  <input id="slider" type="range">
  <span id="clock">00:00:00</span>
  <span id="count">0 aut</span>
  <span id="sample"></span>
  <span id="base">Podkład wyłączony.</span>
  <span id="curves"></span>
  <button id="three" type="button">3D</button>
  <button id="hide" type="button">ukryj</button>
</div>
<script>
// MapLibre 6 jest tylko ESM i wymaga WebGL2; błąd ładowania pokazuje bootMap().
window.mapLibrary = import("./vendor/maplibre/maplibre-gl.mjs").then((m) => { window.maplibregl = m; }, (e) => { window.mapLibraryError = String(e); });
</script>
<script src="vendor/deck.min.js"></script>
<script src="engine.js"></script>
<script>
let boot = {};
const VMAX = 14;
const ROAD = {
  motorway: "#d5dde6", motorway_link: "#d5dde6",
  primary: "#aeb6c2", primary_link: "#aeb6c2",
  secondary: "#7d8694", secondary_link: "#7d8694",
  tertiary: "#7d8694", tertiary_link: "#7d8694",
  boundary_turnaround: "#2a3038"
};
// Kolor dróg OSM (przełącznik w panelu): klasa drogi, łącznica bierze kolor klasy głównej.
const ROAD_OSM = [
  ["autostrada", "#e892a2", ["motorway", "motorway_link"], 4],
  ["droga główna", "#fcd6a4", ["primary", "primary_link"], 3],
  ["droga drugorzędna", "#f7fabf", ["secondary", "secondary_link"], 2.5],
  ["droga trzeciorzędna", "#ffffff", ["tertiary", "tertiary_link"], 2],
  ["ulica osiedlowa", "#c5d0dc", ["residential"], 1.5],
  ["droga bez klasy", "#9aa3b2", ["unclassified"], 1.5],
  ["strefa zamieszkania", "#ededed", ["living_street"], 1.25],
  ["zawrotka graniczna", "#2a3038", ["boundary_turnaround"], 0.75],
];
const ROAD_OSM_OTHER = ["inna", "#4e5663", [], 1];
// Kolor auta w trybie „klasa”: kim jest pojazd (inna tabela niż drogi). „?” to klasa „inne”.
const CLASS_COLOR = {resident: "#5aa2ff", commuter: "#3dbe7a", outbound: "#e0c15a", tlo: "#a89880", ciezkie: "#e15a4a", "?": "#e7e9ee"};
let carByClass = false, classRgb = null;
// Znacznik auta: grot (kierunek jazdy, długość tip × podstawa) + półkole z tyłu, punkt pojazdu w środku podstawy. Rozmiary w pikselach
// przy zoomie z0 (mnożnik 1); mnożnik rośnie z zoomem o 2^(exp·Δzoom), w granicach min–max. Do strojenia po obejrzeniu.
const MARKER = {base: 16, heavy: 22, tip: 1.7, z0: 15, exp: 0.5, min: 0.25, max: 3};
function markerScale(zoom) {
  return Math.min(MARKER.max, Math.max(MARKER.min, Math.pow(2, MARKER.exp * (zoom - MARKER.z0))));
}
// Modele 3D aut (checkbox): bryły z kodu, w metrach, oś +x = kierunek jazdy. Przy włączonych modelach ikony (grot) nie są rysowane wcale.
// Model nie jest mniejszy niż znacznik: długość osobówki na ekranie = MODEL_PX × mnożnik zoomu znacznika (to samo co grot).
const MODEL_PX = 35, CAR_LEN = 4.5, HEAVY_LEN = 10;
function modelScale(heavy) {
  const lat = map.getCenter().lat, zoom = map.getZoom();
  const pxPerM = Math.pow(2, zoom) * 512 / (40075016.686 * Math.cos(lat * Math.PI / 180));
  const target = MODEL_PX * markerScale(zoom) * (heavy ? MARKER.heavy / MARKER.base : 1);
  return Math.max(1, target / ((heavy ? HEAVY_LEN : CAR_LEN) * pxPerM));
}
function box(parts) {
  const pos = [], nor = [], idx = [];
  parts.forEach(([x0, x1, y0, y1, z0, z1]) => {
    const faces = [
      [[1, 0, 0], [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]]],
      [[-1, 0, 0], [[x0, y1, z0], [x0, y0, z0], [x0, y0, z1], [x0, y1, z1]]],
      [[0, 1, 0], [[x1, y1, z0], [x0, y1, z0], [x0, y1, z1], [x1, y1, z1]]],
      [[0, -1, 0], [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]]],
      [[0, 0, 1], [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]]],
    ];
    faces.forEach(([n, v]) => {
      const base = pos.length / 3;
      v.forEach((p) => { pos.push(...p); nor.push(...n); });
      idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
    });
  });
  const n = pos.length / 3;
  return {
    attributes: {positions: {value: new Float32Array(pos), size: 3}, normals: {value: new Float32Array(nor), size: 3},
      texCoords: {value: new Float32Array(2 * n), size: 2}},
    indices: {value: new Uint16Array(idx), size: 1},
  };
}
const MESH = {
  car: box([[-2.25, 2.25, -0.9, 0.9, 0.25, 0.95], [-1.3, 0.8, -0.8, 0.8, 0.95, 1.5]]),
  heavy: box([[-5, 2.4, -1.25, 1.25, 0.5, 3.2], [2.6, 5, -1.2, 1.2, 0.5, 2.7]]),
};
// Osobówka: model Quaternius (CC0), przeliczony przez pipeline/viz_models.py. Nadwozie dostaje kolor pojazdu, reszta zostaje ciemna.
const CAR_ROLE_COLOR = [[1, 1, 1, 1], [0.18, 0.24, 0.32, 1], [0.15, 0.15, 0.17, 1], [0.94, 0.86, 0.5, 1], [0.92, 0.92, 0.92, 1]];
async function loadCarMesh() {
  try {
    const res = await fetch("vendor/quaternius/car_mesh.json");
    if (!res.ok) return;
    const m = await res.json();
    const n = m.n, colors = new Float32Array(4 * n), index = new Uint16Array(n);
    for (let i = 0; i < n; i++) { colors.set(CAR_ROLE_COLOR[m.roles[i]], 4 * i); index[i] = i; }
    MESH.car = {
      attributes: {positions: {value: new Float32Array(m.positions), size: 3}, normals: {value: new Float32Array(m.normals), size: 3},
        texCoords: {value: new Float32Array(2 * n), size: 2}, colors: {value: colors, size: 4}},
      indices: {value: index, size: 1},
    };
    carMeshColors = true;
    dirty = true;
  } catch (err) { /* zostaje bryła z kodu */ }
}
let carMeshColors = false;
let modelsOn = false;
let osmRoads = false;
let t = 0, tMin = 0, tMax = 1;
let playing = false, mult = 1, scrub = false, dirty = false;
// Cały stan widoku jest tu i klatkę liczy tu engine.js. Python (describe) tylko opisuje zaznaczenie.
let classesOn = [], selected = null, follow = false;
let engine = null, mask = null, anchor = null;
let panelForce = true, panelAt = 0, panelSeq = 0;
let wantKey = "", lastSel = null;
let overlay = null, roads = null, buf = null, threeD = false, buildingData = null;
function change() { dirty = true; panelForce = true; }
function setMask() {
  mask = Uint8Array.from(engine.classKeys, (k) => (classesOn.indexOf(k) >= 0 ? 1 : 0));
}
window.hold = false;
window.drawnN = 0;
window.drawError = "";
window.mapReady = false;
window.apiReady = false;
window.mapSize = "";

function clock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function auta(n) {
  if (n === 1) return "1 auto";
  const d = n % 10, h = n % 100;
  if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return n + " auta";
  return n + " aut";
}
const RAMP = (() => {
  const a = [255, 31, 13], b = [255, 179, 26], c = [26, 230, 255];
  const mix = (p, q, f) => p.map((v, i) => Math.round(v + (q[i] - v) * f));
  const lut = new Uint8Array(65 * 3);
  for (let k = 0; k <= 64; k++) {
    const u = k / 64;
    lut.set(u < 0.4 ? mix(a, b, u / 0.4) : mix(b, c, (u - 0.4) / 0.6), 3 * k);
  }
  return lut;
})();
function hexRgb(hex) { return [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)); }
function roadColor(name) { return ROAD[name] || "#4e5663"; }
function roadRowOsm(name) { return ROAD_OSM.find((r) => r[2].indexOf(name) >= 0) || ROAD_OSM_OTHER; }
function roadLegend() {
  const box = document.getElementById("lg-road");
  box.replaceChildren();
  const types = boot.types || [];
  const add = (label, color) => {
    const d = document.createElement("div");
    const i = document.createElement("i");
    i.style.background = color;
    d.append(i, label);
    box.appendChild(d);
  };
  ROAD_OSM.forEach((r) => { if (types.some((x) => r[2].indexOf(x) >= 0)) add(r[0], r[1]); });
  if (types.some((x) => !ROAD_OSM.some((r) => r[2].indexOf(x) >= 0))) add(ROAD_OSM_OTHER[0], ROAD_OSM_OTHER[1]);
}
function setCarColor(byClass) {
  carByClass = byClass;
  document.getElementById("carcolor").textContent = "kolor auta: " + (byClass ? "klasa" : "prędkość");
  document.getElementById("carcolor").classList.toggle("on", byClass);
  document.getElementById("lg-speed").hidden = byClass;
  const box = document.getElementById("lg-class");
  box.hidden = !byClass;
  box.replaceChildren();
  (boot.classes || []).forEach((c) => {
    const d = document.createElement("div");
    const i = document.createElement("i");
    i.style.background = CLASS_COLOR[c.key] || CLASS_COLOR["?"];
    d.append(i, c.name);
    box.appendChild(d);
  });
  dirty = true;
}
function setOsmRoads(on) {
  osmRoads = on;
  document.getElementById("osmroads").checked = on;
  document.getElementById("lg-road").hidden = !on;
  if (on) roadLegend();
  dirty = true;
}
function roadWidth(name) {
  if (name.indexOf("motorway") === 0) return 2;
  if (name.indexOf("primary") === 0) return 1.5;
  if (name.indexOf("secondary") === 0 || name.indexOf("tertiary") === 0) return 1.25;
  if (name === "boundary_turnaround") return 0.75;
  return 1;
}

const slider = document.getElementById("slider");
const chips = document.getElementById("chips");
function applyBoot() {
  t = boot.t;
  classesOn = (boot.classes || []).filter((c) => c.on).map((c) => c.key);
  tMin = boot.tMin;
  tMax = boot.tMax;
  document.getElementById("run").textContent = boot.run || "";
  document.getElementById("sample").textContent = "próbka " + boot.sample;
  document.getElementById("curves").textContent = boot.curveNote || "";
  document.getElementById("clock").textContent = clock(t);
  slider.min = tMin;
  slider.max = tMax;
  slider.step = "1";
  slider.value = String(t);
  if (boot.basemap) document.getElementById("base").hidden = true;
  (boot.classes || []).forEach((c) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (c.on ? " on" : "");
    b.dataset.key = c.key;
    b.textContent = c.name;
    b.addEventListener("click", () => {
      b.classList.toggle("on");
      classesOn = [...chips.querySelectorAll(".chip.on")].map((x) => x.dataset.key);
      if (engine) setMask();
      change();
    });
    chips.appendChild(b);
  });
  if (engine) setMask();
  document.getElementById("bleg").textContent = boot.bld ? boot.buildingsNote + ". © OpenStreetMap contributors" : "";
  if (boot.bld) document.getElementById("three").title = boot.buildingsNote;
}

// boot.json to małe metadane; tablice (linki, łamane) idą jako pliki binarne tego samego serwera.
async function loadBoot() {
  const get = async (name, kind) => {
    const res = await fetch(name);
    if (!res.ok) throw new Error(name + " " + res.status);
    return kind === "json" ? res.json() : new kind(await res.arrayBuffer());
  };
  boot = await get("boot.json", "json");
  if (boot.error) return;
  boot.linkLL = await get("link_ll.bin", Float64Array);
  boot.linkType = await get("link_type.bin", Uint8Array);
  if (boot.nCurve) {
    boot.curveOff = await get("curve_off.bin", Int32Array);
    boot.curveLon = await get("curve_lon.bin", Float64Array);
    boot.curveLat = await get("curve_lat.bin", Float64Array);
  }
  if (boot.buildings) {
    const q = "?v=" + boot.buildings.split("?v=")[1];
    const meta = await get("data/buildings.json" + q, "json");
    boot.bld = {
      meta, off: await get("data/buildings_off.bin" + q, Int32Array), xy: await get("data/buildings_xy.bin" + q, Float32Array),
      h: await get("data/buildings_h.bin" + q, Float32Array), src: await get("data/buildings_src.bin" + q, Uint8Array),
    };
  }
  const curves = boot.nCurve ? {off: boot.curveOff, lon: boot.curveLon, lat: boot.curveLat} : null;
  const getData = async (name, kind) => {
    const res = await fetch(name);
    if (!res.ok) throw new Error(name + " " + res.status);
    return kind === "json" ? res.json() : res.arrayBuffer();
  };
  engine = await Engine.load("data/", getData, curves, boot.linkLL, boot.data.split("/").pop());
  await engine.want(boot.t);
}

const STAY_NAME = {home: "dom", work: "praca", tlo_start: "tło", tlo_end: "tło"};
function segName(seg) {
  if (seg.trip) return "jazda";
  return STAY_NAME[seg.label] || seg.label;
}
function axisPos(segments, time) {
  let prev = 0;
  for (let i = 0; i < segments.length; i++) {
    const seg = segments[i];
    if (time < seg.t0) return prev;
    const last = i === segments.length - 1;
    if (time < seg.t1 || (last && time <= seg.t1 + 1e-3)) {
      const dur = Math.max(seg.t1 - seg.t0, 1e-9);
      const f = Math.min(1, Math.max(0, (time - seg.t0) / dur));
      return seg.u0 + f * (seg.u1 - seg.u0);
    }
    prev = seg.u1;
  }
  return prev;
}
function timeFromAxis(u) {
  const segs = window.axisSegs || [];
  if (!segs.length) return tMin + u * (tMax - tMin);
  for (let i = 0; i < segs.length; i++) {
    const seg = segs[i];
    if (u <= seg.u1 || i === segs.length - 1) {
      const span = Math.max(seg.u1 - seg.u0, 1e-9);
      const f = Math.min(1, Math.max(0, (u - seg.u0) / span));
      return seg.t0 + f * (seg.t1 - seg.t0);
    }
  }
  return segs[segs.length - 1].t1;
}
function showAxis(segments) {
  const box = document.getElementById("axis");
  const bar = document.getElementById("axis-bar");
  bar.replaceChildren();
  window.axisSegs = segments || [];
  if (!segments || !segments.length) {
    box.hidden = true;
    return;
  }
  box.hidden = false;
  segments.forEach((seg) => {

let map = null;
// Drogi to jedna statyczna warstwa deck.gl: łamana OSM (gdy jest), inaczej cięciwa.
function buildRoads() {
  const ll = boot.linkLL, off = boot.curveOff, out = [];
  for (let i = 0; i < boot.nLinks; i++) {
    const a = off ? off[i] : 0, b = off ? off[i + 1] : 0;
    let path;
    if (off && b - a >= 2) {
      path = [];
      for (let k = a; k < b; k++) path.push([boot.curveLon[k], boot.curveLat[k]]);
    } else {
      path = [[ll[4 * i], ll[4 * i + 1]], [ll[4 * i + 2], ll[4 * i + 3]]];
    }
    const name = boot.types[boot.linkType[i]] || "";
    out.push({path, color: hexRgb(roadColor(name)), cosm: hexRgb(roadRowOsm(name)[1]), wosm: roadRowOsm(name)[3], width: roadWidth(name)});
  }
  return out;
}
function sqDistToSegment(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, den = dx * dx + dy * dy;
  let u = den < 1e-12 ? 0 : ((px - a.x) * dx + (py - a.y) * dy) / den;
  u = Math.min(1, Math.max(0, u));
  const ex = a.x + u * dx - px, ey = a.y + u * dy - py;
  return ex * ex + ey * ey;
}
// Najbliższe auto z ostatniej klatki (8 px), inaczej najbliższy odcinek drogi.
function pickAt(p) {
  const tol = 8, fr = engine.out;
  let best = -1, bd = tol * tol;
  for (let i = 0; i < fr.n; i++) {
    const q = map.project([fr.lon[i], fr.lat[i]]);
    const dx = q.x - p.x, dy = q.y - p.y, d = dx * dx + dy * dy;
    if (d <= bd) { bd = d; best = i; }
  }
  if (best >= 0) return {id: engine.personId(fr.track[best])};
  const w = map.getContainer().clientWidth, h = map.getContainer().clientHeight;
  let link = -1;
  bd = tol * tol;
  for (let i = 0; i < roads.length; i++) {
    const pts = roads[i].path.map((c) => map.project(c));
    if (pts.every((q) => q.x < -tol) || pts.every((q) => q.x > w + tol) || pts.every((q) => q.y < -tol) || pts.every((q) => q.y > h + tol)) continue;
    for (let k = 1; k < pts.length; k++) {
      const d = sqDistToSegment(p.x, p.y, pts[k - 1], pts[k]);
      if (d <= bd) { bd = d; link = i; }
    }
  }
  return link >= 0 ? {link} : null;
}

// Budynki: jedna statyczna warstwa wyciągnięta o wysokość z eksportu (h_source: tag, piętra, założenie).
const BUILDING_COLOR = [[124, 138, 162], [96, 108, 130], [66, 74, 90]];
function buildBuildings() {
  const b = boot.bld, out = new Array(b.h.length), lon0 = b.meta.origin_lonlat[0], lat0 = b.meta.origin_lonlat[1];
  for (let i = 0; i < out.length; i++) {
    const poly = [];
    for (let k = b.off[i]; k < b.off[i + 1]; k++) poly.push([lon0 + b.xy[2 * k], lat0 + b.xy[2 * k + 1]]);
    out[i] = {polygon: poly, h: b.h[i], color: BUILDING_COLOR[b.src[i]]};
  }
  return out;
}

function allocBuffers(max) {

// Rysuje klatkę z engine.frame. Zwraca false, gdy porcja czasu jeszcze się nie wczytała.
function render() {

      } else {

      }

      buf.size[i] = MARKER_ICON_H * zs * (engine.classHeavy[fr.cls[i]] ? MARKER.heavy / MARKER.base : 1);
      buf.ang[i] = fr.heading[i] * 180 / Math.PI;
    }

    if (boot.bld) {

// Opis zaznaczenia (lista czynności, linki) zna tylko indeks w Pythonie, więc pytamy go rzadko.
function refreshPanel(fr) {
  const api = window.pywebview && window.pywebview.api;
  if (!selected) {
    if (panelForce) { showPanel({kind: "empty"}); anchor = null; panelForce = false; }
    return;
  }
  if (!api || !api.describe) return;
  const now = performance.now();
  if (!panelForce && now - panelAt < 250) return;
  panelAt = now;
  panelForce = false;
  const seq = ++panelSeq;
  const links = selected.link != null ? engine.linkNow(fr, selected.link) : null;
  api.describe(t, selected, lastSel, links).then((r) => {
    if (seq !== panelSeq) return;
    showPanel(r.panel);
    anchor = r.anchor;
  }).catch((err) => { window.drawError = String(err); });
}

// Porcje czasu wokół t (i od początku przejazdu zaznaczonego auta, do śladu).
function ensure() {
  let since = null;

    const id = engine.activeTrack(engine.personIndex(selected.id), t);
    if (id != null) since = engine.tr.t0[id];
  }
  const key = engine.chunkIndex(t) + ":" + (since == null ? "" : engine.chunkIndex(since));
  if (key === wantKey) return;

}
// Do testów okna: klatka klienta w czasie tt dla kluczy klas keys, posortowana po numerze przejazdu.
window.clientFrame = async (tt, keys) => {
  await engine.want(tt);
  const on = Uint8Array.from(engine.classKeys, (k) => (keys.indexOf(k) >= 0 ? 1 : 0));
  const fr = engine.frame(tt, on);
  const order = Array.from({length: fr.n}, (_, i) => i).sort((a, b) => fr.track[a] - fr.track[b]);
  return {
    n: fr.n, track: order.map((i) => fr.track[i]), lon: order.map((i) => fr.lon[i]), lat: order.map((i) => fr.lat[i]),
    speed: order.map((i) => fr.speed[i]), link: order.map((i) => fr.link[i]),
  };
};

let lastNow = 0;
function loop(now) {
  if (!window.hold && playing && !scrub) {
    const dt = lastNow ? Math.min(0.1, (now - lastNow) / 1000) : 0;
    t = Math.min(tMax, Math.max(tMin, t + dt * mult));
    if (t >= tMax) setPlaying(false);
    dirty = true;

  lastNow = now;
  if (!window.hold && engine && map) {

// Atlas znacznika: trzy ikony obok siebie (wypełnienie, obrys 1 px, obrys zaznaczenia), jednostka = piksel przy mnożniku 1.
const MARKER_ICON_W = 48, MARKER_ICON_H = 24, MARKER_PX = 4;
let markerAtlas = null, markerMapping = null;
function makeMarker() {
  const S = MARKER_PX, W = MARKER_ICON_W * S, H = MARKER_ICON_H * S;
  const c = document.createElement("canvas");
  c.width = 3 * W;
  c.height = H;
  const g = c.getContext("2d");
  const half = MARKER.base / 2;
  const shape = (ix) => {
    g.beginPath();
    g.translate(ix * W + 12 * S, H / 2);
    g.moveTo(MARKER.tip * MARKER.base * S, 0);
    g.lineTo(0, -half * S);
    g.arc(0, 0, half * S, -Math.PI / 2, Math.PI / 2, true);
    g.closePath();
    g.setTransform(1, 0, 0, 1, 0, 0);
  };
  g.fillStyle = g.strokeStyle = "#fff";
  g.lineJoin = "round";
  shape(0);
  g.fill();
  shape(1);
  g.lineWidth = 2 * S;
  g.stroke();
  g.fill();
  shape(2);
  g.lineWidth = 1.5 * S;
  g.stroke();
  const icon = (ix) => ({x: ix * W, y: 0, width: W, height: H, anchorX: 12 * S, anchorY: H / 2, mask: true});
  markerMapping = {fill: icon(0), out: icon(1), ring: icon(2)};
  return c.toDataURL();
}

    const hit = pickAt(ev.point);
    if (!hit) return;
    selected = hit;
    follow = false;
    change();
  });
  map.on("move", () => { dirty = true; });
  map.on("resize", () => { dirty = true; });
  map.once("load", () => {
    window.mapSize = map.getContainer().clientWidth + "x" + map.getContainer().clientHeight;
    window.mapReady = true;
    dirty = true;
  });
}
window.addEventListener("pywebviewready", () => { window.apiReady = true; dirty = true; });
loadBoot().then(() => { applyBoot(); return bootMap(); }).catch((err) => { window.drawError = String(err && err.stack || err); });
requestAnimationFrame(loop);
</script>
